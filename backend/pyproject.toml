[project]
name = "streams-explorer"
version = "2.4.2"
description = "Explore Data Pipelines in Apache Kafka."
readme = "README.md"
authors = [{ name = "bakdata" }]
license = "MIT"
keywords = ["kafka", "kubernetes", "stream-processing", "monitoring", "pipelines"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Intended Audience :: Developers",
  "Typing :: Typed",
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "loguru>=0.5.3,<0.6.0",
  "matplotlib>=3.4.3,<4.0.0",
  "networkx>=2.6.3,<3.0.0",
  "dynaconf>=3.1.7,<4.0.0",
  "httpx>=0.23.1,<0.24.0",
  "pydantic>=1.9.1,<2.0.0",
  "fastapi-utils>=0.2.1,<0.3.0",
  "fastapi>=0.103.1,<0.104.0",
  "uvicorn[standard]>=0.20.0,<0.21.0",
  "pygraphviz>=1.10,<2.0",
  "confluent-kafka==2.4.0",
  "cachetools>=4.2.2,<5.0.0",
  "kubernetes-asyncio>=32.0.0,<33.0.0",
]

[project.urls]
Repository = "https://github.com/bakdata/streams-explorer"
"Bug Tracker" = "https://github.com/bakdata/streams-explorer/issues"

[project.scripts]
start = "main:start"

[dependency-groups]
dev = [
  "mypy>=0.981,<0.982",
  "flake8>=4.0.1,<5.0.0",
  "black>=22.6.0,<23.0.0",
  "isort>=5.12.0,<6.0.0",
  "pytest>=7.2.0,<8.0.0",
  "pre-commit>=2.15.0,<3.0.0",
  "pytest-asyncio>=0.20.1,<0.21.0",
  "pytest-clarity>=1.0.1,<2.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "pytest-mock>=3.6.1,<4.0.0",
  "respx>=0.20.1,<0.21.0",
  "requests>=2.27.1,<3.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
