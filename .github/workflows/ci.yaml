name: CI

on:
  push:
    branches: [main]
    tags: ["v?[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    env:
      working-directory: ./backend
    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - uses: actions/checkout@v3

      - name: Install packages
        run: sudo apt-get -y install python3-dev graphviz libgraphviz-dev pkg-config python3-wheel

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions

      - name: Check uv.lock
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (flake8)
        run: uv run --frozen pre-commit run flake8 --all-files --show-diff-on-failure

      - name: Order of imports (isort)
        run: uv run --frozen pre-commit run isort --all-files --show-diff-on-failure

      - name: Formatting (black)
        run: uv run --frozen pre-commit run black --all-files --show-diff-on-failure

      - name: Typing (mypy)
        run: uv run --frozen pre-commit run mypy --all-files

      - name: Test
        run: uv run --frozen pytest tests --cov=streams_explorer --cov-report term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    env:
      working-directory: ./frontend
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]
    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ env.working-directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Formatting (dprint)
        run: pre-commit run dprint --all-files

      - name: Fetchers
        run: pre-commit run generate-fetchers --all-files

      - name: Run Tests
        run: npm run test:ci

  docker:
    name: Docker
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    env:
      image: bakdata/streams-explorer
    steps:
      - name: Configure Docker
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        uses: crazy-max/ghaction-setup-docker@v2
        with:
          version: v24.0.6
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Setup Qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ inputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.image }}
          tags: |
            event=pr,type=sha
            event=push,type=sha
            event=tag,type=semver,pattern=v{{version}}

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
