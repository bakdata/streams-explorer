name: Publish to PyPI

on:
  push:
    tags: ["v?[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: .tool-versions

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
