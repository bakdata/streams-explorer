name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "SemVer scope of the release"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    uses: bakdata/ci-templates/.github/workflows/python-uv-release.yaml@2.3.0
    with:
      release-type: ${{ inputs.release-type }}
    secrets:
      github-username: ${{ secrets.GH_USERNAME }}
      github-email: ${{ secrets.GH_EMAIL }}
      github-token: ${{ secrets.GH_TOKEN }}
